<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برای تو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --forest-deep:#122920;
    --forest-mid:#2c4a3a;
    --forest-soft:#3f6350;
    --mist:#dbe6dd;
    --tea-amber:#c68a3d;
    --rose-warm:#b5544a;
    --paper:#f3efe4;
    --paper-dim:#e7e1d0;
    --ink:#101c16;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(circle at 18% -8%, rgba(63,99,80,.55), transparent 50%),
      radial-gradient(circle at 85% 15%, rgba(198,138,61,.12), transparent 40%),
      radial-gradient(circle at 50% 85%, rgba(181,84,74,.10), transparent 45%),
      linear-gradient(180deg, #16311f 0%, #122920 30%, #0d2118 65%, #0a1a13 100%);
    color:var(--paper);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%, transparent 40%, rgba(6,15,10,.55) 100%);
  }

  #rain-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    opacity:.55;
  }

  #hearts-layer{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .floaty-heart{
    position:absolute;
    bottom:-40px;
    font-size:16px;
    opacity:0;
    animation-name:floatUp;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 0 6px rgba(181,84,74,.25));
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    8%{opacity:.85;}
    50%{transform:translateY(-52vh) translateX(14px) rotate(8deg);}
    88%{opacity:.6;}
    100%{transform:translateY(-105vh) translateX(-10px) rotate(-6deg); opacity:0;}
  }

  .heart-accent{
    display:inline-block;
    margin-inline-start:6px;
    filter:drop-shadow(0 2px 6px rgba(181,84,74,.3));
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:760px;
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
  }
  .hero .eyebrow{
    font-weight:400;
    letter-spacing:.4em;
    font-size:12px;
    color:var(--tea-amber);
    margin-bottom:22px;
    opacity:0;
    animation:fadeUp 1s ease forwards .2s;
  }
  .hero .eyebrow .heart-accent{
    letter-spacing:0;
  }
  .hero h1{
    font-weight:900;
    font-size:clamp(38px, 8vw, 74px);
    line-height:1.25;
    color:var(--paper);
    text-shadow:0 8px 40px rgba(0,0,0,.35);
    opacity:0;
    animation:fadeUp 1.1s ease forwards .5s;
  }
  .hero h1 span{
    color:var(--rose-warm);
  }
  .hero p.sub{
    margin-top:24px;
    font-weight:300;
    font-size:clamp(15px, 2.6vw, 19px);
    color:var(--mist);
    max-width:520px;
    line-height:2;
    opacity:0;
    animation:fadeUp 1.1s ease forwards .85s;
  }
  .scroll-hint{
    margin-top:56px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    opacity:0;
    animation:fadeUp 1s ease forwards 1.3s;
  }
  .scroll-hint span{
    font-size:12px;
    color:var(--mist);
    opacity:.7;
    letter-spacing:.15em;
  }
  .drop{
    width:2px;
    height:36px;
    background:linear-gradient(var(--tea-amber), transparent);
    animation:dripline 1.6s ease-in-out infinite;
  }
  @keyframes dripline{
    0%{transform:translateY(0); opacity:0;}
    30%{opacity:1;}
    100%{transform:translateY(14px); opacity:0;}
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(22px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- TIMELINE / CHAPTERS ---------- */
  .timeline{
    position:relative;
    padding:60px 0 40px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    right:19px;
    width:1px;
    background:linear-gradient(var(--forest-soft), var(--tea-amber) 50%, var(--forest-soft));
    opacity:.5;
  }
  .chapter{
    position:relative;
    padding:0 0 120px 0;
    padding-right:56px;
    opacity:0;
    transform:translateY(40px);
    transition:opacity .9s ease, transform .9s ease;
  }
  .chapter.visible{
    opacity:1;
    transform:translateY(0);
  }
  .chapter:last-child{padding-bottom:40px;}
  .chapter .marker{
    position:absolute;
    right:9px;
    top:2px;
    font-size:20px;
    line-height:1;
    filter:drop-shadow(0 0 8px rgba(198,138,61,.4));
  }
  .chapter .date{
    display:block;
    font-size:12px;
    letter-spacing:.2em;
    color:var(--tea-amber);
    font-weight:500;
    margin-bottom:10px;
  }
  .chapter h2{
    font-size:clamp(22px, 4vw, 30px);
    font-weight:700;
    color:var(--paper);
    margin-bottom:14px;
    line-height:1.5;
  }
  .chapter p{
    font-weight:300;
    font-size:16px;
    line-height:2.05;
    color:var(--mist);
    max-width:600px;
  }
  .chapter .frame{
    margin-top:22px;
    border-radius:14px;
    overflow:hidden;
    background:linear-gradient(135deg, var(--forest-mid), var(--forest-soft));
    aspect-ratio:4/5;
    max-height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 18px 46px rgba(0,0,0,.4), 0 0 0 1px rgba(198,138,61,.06);
  }
  .chapter .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 20%;
    display:block;
  }
  .chapter .frame.placeholder{
    color:var(--mist);
    font-size:13px;
    font-weight:300;
    opacity:.55;
    text-align:center;
    padding:20px;
    line-height:1.9;
  }

  /* ---------- TEA / STEAM DIVIDER ---------- */
  .steam-divider{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0 80px;
    opacity:.85;
  }
  .cup{
    font-size:34px;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));
  }
  .steam-line{
    width:1px;
    height:70px;
    background:linear-gradient(var(--tea-amber), transparent);
    margin-top:10px;
    animation:waft 3.5s ease-in-out infinite;
  }
  @keyframes waft{
    0%,100%{transform:translateX(0) scaleY(1); opacity:.5;}
    50%{transform:translateX(6px) scaleY(1.08); opacity:.9;}
  }

  /* ---------- CLOSING ---------- */
  .closing{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 0 100px;
  }
  .closing .eyebrow{
    letter-spacing:.4em;
    font-size:12px;
    color:var(--tea-amber);
    margin-bottom:26px;
  }
  .closing h2{
    font-size:clamp(28px, 6vw, 46px);
    font-weight:900;
    line-height:1.6;
    max-width:640px;
    color:var(--paper);
  }
  .closing h2 .accent{color:var(--rose-warm);}
  .closing p.msg{
    margin-top:26px;
    font-weight:300;
    font-size:17px;
    line-height:2.1;
    color:var(--mist);
    max-width:560px;
  }

  .reveal-btn{
    margin-top:44px;
    background:var(--rose-warm);
    color:var(--paper);
    border:none;
    padding:16px 40px;
    border-radius:100px;
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    letter-spacing:.03em;
    box-shadow:0 12px 30px rgba(181,84,74,.35);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .reveal-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 36px rgba(181,84,74,.45);
  }
  .reveal-btn:focus-visible{
    outline:2px solid var(--paper);
    outline-offset:3px;
  }

  .final-note{
    margin-top:34px;
    max-width:560px;
    background:rgba(243,239,228,.06);
    border:1px solid rgba(243,239,228,.14);
    border-radius:18px;
    padding:30px 28px;
    font-size:16px;
    line-height:2.1;
    font-weight:300;
    color:var(--paper);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity .7s ease, max-height 1s ease, padding .7s ease, margin .7s ease;
  }
  .final-note.open{
    opacity:1;
    max-height:600px;
    margin-top:34px;
  }
  .final-note .sign{
    display:block;
    margin-top:18px;
    color:var(--tea-amber);
    font-weight:500;
  }

  footer{
    text-align:center;
    padding:36px 0 50px;
    font-size:11px;
    color:var(--mist);
    opacity:.35;
    letter-spacing:.1em;
    position:relative;
    z-index:2;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  @media (max-width:520px){
    .chapter{padding-right:44px;}
    .timeline::before{right:15px;}
    .chapter .marker{right:9px;}
  }
</style>
</head>
<body>

<canvas id="rain-canvas"></canvas>
<div id="hearts-layer"></div>

<main class="wrap">

  <section class="hero">
    <div class="eyebrow" id="hero-eyebrow"></div>
    <h1 id="hero-title"></h1>
    <p class="sub" id="hero-sub"></p>
    <div class="scroll-hint">
      <div class="drop"></div>
      <span>پایین‌تر برو</span>
    </div>
  </section>

  <section class="timeline" id="timeline"></section>

  <div class="steam-divider">
    <div class="cup">☕</div>
    <div class="steam-line"></div>
  </div>

  <section class="closing">
    <div class="eyebrow">و امروز <span class="heart-accent">🤎</span></div>
    <h2 id="closing-title"></h2>
    <p class="msg" id="closing-sub"></p>
    <button class="reveal-btn" id="reveal-btn">برایم یک پیام مونده</button>
    <div class="final-note" id="final-note"></div>
  </section>

  <footer>ساخته‌شده با عشق، برای یک نفر خاص</footer>

</main>

<script>
/* =========================================================================
   بخش قابل‌ویرایش — فقط همین‌جا رو تغییر بده، بقیه‌ی کد رو دست نزن

   - partnerName: اسم دوست‌دخترت

   - sinceLabel: از کی با همیم (مثلا «از بهار ۱۴۰۲»)
   - heroSub: یک جمله‌ی کوتاه زیر عنوان اصلی
   - memories: هر خاطره یک فصل از داستان می‌شه. هرکدوم می‌تونه عکس داشته باشه
     یا نداشته باشه (اگه image رو خالی بذاری، یه قاب تزئینی جاش میاد)

const CONFIG = {
  partnerName: "آدینه",
  yourName: "شایان",
  sinceLabel: "از هفتم دی‌ماه ۱۴۰۴ باهمیم",
  heroSub: "یه داستان کوچیک از همه‌ی روزهایی که کنار هم رد شد، از هفتم دی‌ماه تا همین امروز. تا آخرش با من بیا.",

  memories: [
    {
      date: "۷ دی ۱۴۰۴ — کافه و لب دریا",
      title: "اولین باری که دیدمت",
      text: "رفتیم کافه، همون اول بهم قول دادی که کنارش می‌ذاری. فکر می‌کردم سر قولت نمی‌مونی، ولی به‌خاطر من گذاشتیش کنار. تا صبح رفتیم لب دریا؛ پتو رو مثل چادر پیچیده بودی دور خودت از سرما. هوا خیلی سرد بود، ولی کلی کنار هم خندیدیم.",
      image: IMG1
    },
    {

      image: IMG2
    },
    {
      date: "همیشه",

      text: "عاشق اینم که همه‌جوره مثل خودمی. وقتی پیشتم احساس راحتی می‌کنم، کاملاً خودمم. همیشه پشتمی، حواست بهم هست. برق تو چشات وقتی نگاهم می‌کنی بی‌نظیره.",
      image: IMG3
    }
  ],

  closingTitle: 'هرچی که بگذره، تو <span class="accent">همونی</span> هستی که می‌خوامش',

  finalMessage: `شاید تو مسیر زندگیمون پستی‌وبلندی هم داشته باشیم، ولی من هیچ‌وقت تنهات نمی‌ذارم.

/* ========================= پایان بخش قابل‌ویرایش ========================= */

document.getElementById('hero-eyebrow').innerHTML = `${CONFIG.sinceLabel} <span class="heart-accent">💕</span>`;
document.getElementById('hero-title').innerHTML = `برای <span>${CONFIG.partnerName}</span>`;
document.getElementById('hero-sub').textContent = CONFIG.heroSub;
document.getElementById('closing-title').innerHTML = CONFIG.closingTitle;
document.getElementById('closing-sub').textContent = CONFIG.closingSub;

const timeline = document.getElementById('timeline');
const markerHearts = ['💛', '🌿', '✨'];
CONFIG.memories.forEach((m, i) => {
  const chapter = document.createElement('div');
  chapter.className = 'chapter';
  chapter.innerHTML = `
    <div class="marker">${markerHearts[i % markerHearts.length]}</div>
    <span class="date">${m.date}</span>
    <h2>${m.title}</h2>
    <p>${m.text}</p>
    ${m.image
      ? `<div class="frame"><img src="${m.image}" alt="${m.title}"></div>`
      : `<div class="frame placeholder">یه عکس از این خاطره اینجا قشنگ می‌شینه<br>(image رو تو CONFIG پر کن)</div>`}
  `;
  timeline.appendChild(chapter);
});

// scroll reveal for chapters
const chapters = document.querySelectorAll('.chapter');
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.2 });
chapters.forEach(c => io.observe(c));

// final message reveal
const btn = document.getElementById('reveal-btn');
const note = document.getElementById('final-note');
let opened = false;
btn.addEventListener('click', () => {
  opened = !opened;
  if (opened) {
    note.innerHTML = CONFIG.finalMessage.replace(/\n/g, '<br>') + `<span class="sign">— ${CONFIG.yourName}</span>`;
    note.classList.add('open');
    btn.textContent = 'دوباره بخون ↑';
  } else {
    note.classList.remove('open');
    btn.textContent = 'برایم یک پیام مونده';
  }
});

// floating hearts in the background
const heartsLayer = document.getElementById('hearts-layer');
const heartEmojis = ['💕', '💗', '🌸', '✨', '💌', '🤎', '💫'];
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!prefersReducedMotion) {
  const heartCount = 16;
  for (let i = 0; i < heartCount; i++) {
    const el = document.createElement('span');
    el.className = 'floaty-heart';
    el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (13 + Math.random() * 16) + 'px';
    const duration = 14 + Math.random() * 14;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = (Math.random() * duration) + 's';
    heartsLayer.appendChild(el);
  }
}

// gentle rain canvas
const canvas = document.getElementById('rain-canvas');
const ctx = canvas.getContext('2d');
let w, h, drops;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
function initDrops(){
  const count = Math.floor((w*h)/32000);
  drops = Array.from({length: count}, () => ({
    x: Math.random()*w,
    y: Math.random()*h,
    len: 10 + Math.random()*18,
    speed: 3 + Math.random()*4,
    opacity: 0.08 + Math.random()*0.18
  }));
}
function tick(){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = 'rgba(219,230,221,1)';
  ctx.lineWidth = 1;
  drops.forEach(d => {
    ctx.globalAlpha = d.opacity;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x, d.y + d.len);
    ctx.stroke();
    d.y += d.speed;
    if (d.y > h) { d.y = -d.len; d.x = Math.random()*w; }
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
resize();
initDrops();
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  tick();
} else {
  ctx.clearRect(0,0,w,h);
}
window.addEventListener('resize', () => { resize(); initDrops(); });
</script>
